name: Remote launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remote-launcher-apk.yml"
      - "launcher/**"
      - "themes/xiaomi-s55/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Checksum
        run: |
          cd launcher/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            launcher/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 7
